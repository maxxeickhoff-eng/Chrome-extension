<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <!-- Top bar: search on the left, weather on the right -->
  <header class="top">
    <form class="search" id="search-form" role="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search the web" aria-label="Search the web" autocomplete="off">
    </form>

    <div class="weather" id="weather">
      <button class="weather-now" id="weather-btn" type="button" aria-expanded="false">
        <span class="weather-icon" id="weather-icon"></span>
        <span class="weather-temp" id="weather-temp"></span>
        <span class="weather-city" id="weather-city"></span>
      </button>
      <div class="weather-card glass" id="weather-card" hidden></div>
    </div>
  </header>

  <!-- Centre: onboarding, or clock + greeting + focus -->
  <main class="center">
    <section id="onboarding" hidden>
      <h1 class="ask">Hello, what's your name?</h1>
      <form id="name-form"><input class="line-input" id="name-input" maxlength="30" autocomplete="off" aria-label="Your name"></form>
    </section>

    <section id="dashboard" hidden>
      <div class="clock" id="clock">--:--</div>
      <h1 class="greeting" id="greeting"></h1>

      <div class="focus" id="focus">
        <form id="focus-form" hidden>
          <label class="focus-ask" for="focus-input">What is your main focus for today?</label>
          <input class="line-input" id="focus-input" maxlength="80" autocomplete="off">
        </form>
        <div id="focus-show" hidden>
          <div class="focus-label">Today</div>
          <div class="focus-row">
            <input type="checkbox" id="focus-done" aria-label="Mark focus as done">
            <span class="focus-text" id="focus-text"></span>
            <button class="icon-btn" id="focus-clear" type="button" aria-label="Clear focus">×</button>
          </div>
          <div class="focus-praise" id="focus-praise" hidden>Nice work! 🎉</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom bar: settings + photo credit, quote, to-dos -->
  <footer class="bottom">
    <div class="bottom-left">
      <button class="icon-btn big" id="settings-btn" type="button" aria-label="Settings" aria-expanded="false">⚙</button>
      <div class="credit" id="credit"></div>
    </div>

    <figure class="quote" id="quote">
      <blockquote id="quote-text"></blockquote>
      <figcaption id="quote-author"></figcaption>
    </figure>

    <div class="bottom-right">
      <button class="todo-btn" id="todo-btn" type="button" aria-expanded="false">Todo <span id="todo-count"></span></button>
    </div>
  </footer>

  <!-- To-do panel -->
  <aside class="panel glass todo-panel" id="todo-panel" hidden aria-label="To-do list">
    <div class="panel-head">
      <h2>Today's to-dos</h2>
      <button class="link-btn" id="todo-clear" type="button">Clear done</button>
    </div>
    <ul class="todos" id="todos"></ul>
    <p class="empty" id="todo-empty">Nothing here yet. Add your first to-do below.</p>
    <form id="todo-form"><input id="todo-input" placeholder="New to-do" maxlength="100" autocomplete="off" aria-label="New to-do"></form>
  </aside>

  <!-- Settings panel -->
  <aside class="panel glass settings-panel" id="settings-panel" hidden aria-label="Settings">
    <div class="panel-head"><h2>Settings</h2></div>

    <label class="field">Your name
      <input id="set-name" maxlength="30" autocomplete="off">
    </label>

    <form class="field" id="city-form">
      <label for="set-city">Weather city</label>
      <div class="row">
        <input id="set-city" placeholder="e.g. Hamburg" autocomplete="off">
        <button class="small-btn" type="submit">Set</button>
      </div>
      <small id="city-status" class="hint"></small>
    </form>

    <div class="field">Show
      <label class="toggle"><input type="checkbox" data-show="search"> Search bar</label>
      <label class="toggle"><input type="checkbox" data-show="weather"> Weather</label>
      <label class="toggle"><input type="checkbox" data-show="quote"> Quote</label>
      <label class="toggle"><input type="checkbox" data-show="todo"> To-dos</label>
      <label class="toggle"><input type="checkbox" id="set-24h"> 24-hour clock</label>
    </div>

    <div class="field">Background
      <button class="small-btn" id="new-photo" type="button">Show another photo today</button>
    </div>

    <div class="field danger">
      <button class="link-btn" id="reset" type="button">Reset all Daybreak data</button>
    </div>
  </aside>

  <script src="quotes.js"></script>
  <script src="app.js"></script>
</body>
</html>
